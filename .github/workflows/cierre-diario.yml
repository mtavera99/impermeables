name: Cierre diario de ventas

# ══════════════════════════════════════════════════════════════════════════════
# Manda el resumen de ventas del día al WhatsApp del dueño.
#
# POR QUÉ UN GITHUB ACTION Y NO UN TEMPORIZADOR DENTRO DEL BOT:
# el servicio de Render se reinicia con cada despliegue, y un `setInterval` se
# reinicia con él. Si el reinicio cae sobre la hora del cierre, ese día no sale.
# Un Action corre aparte y no depende del estado del bot.
#
# 🔴 LÍMITE DE META, YA COMPROBADO: un mensaje que INICIA el negocio solo se
# entrega si hay una ventana de 24h abierta con ese número (o con plantilla
# aprobada). Si el dueño no le escribió nada al bot ese día, Meta lo acepta y lo
# descarta — pasó hoy con un mensaje de prueba (ok:true con wamid, nunca llegó).
#   → Por eso el resumen SIEMPRE se imprime en el log del Action. Aunque el
#     WhatsApp no llegue, el cierre queda disponible acá.
#   → Truco mientras no haya plantilla: escribirle cualquier cosa al bot en el
#     día abre la ventana y el cierre llega.
# ══════════════════════════════════════════════════════════════════════════════

on:
  schedule:
    # 17:05 Bogotá = 22:05 UTC. Bogotá es UTC−5 fijo (no hay horario de verano),
    # así que la conversión no cambia en el año.
    - cron: "5 22 * * *"
  workflow_dispatch:      # botón manual, sirve desde la app de GitHub en el celular
    inputs:
      dia:
        description: "Día a cerrar (YYYY-MM-DD). Vacío = hoy en Bogotá."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  cierre:
    runs-on: ubuntu-latest
    steps:
      - name: Pedir el cierre al bot y mandarlo por WhatsApp
        env:
          BOT_URL: ${{ secrets.BOT_URL }}
          # 🔴 ESTE ACTION SE ROMPIÓ EL 22-SEP Y ASÍ SE ARREGLA.
          #
          # Usaba BOT_VERIFY_TOKEN, que guardaba el secreto VIEJO. Ese día el bot
          # migró a PANEL_TOKEN (para dejar de compartir clave con el webhook) y
          # el endpoint /cierre empezó a validar la nueva. El Action siguió
          # mandando la vieja y el cierre de ese día murió con HTTP 403.
          #
          # Es la TERCERA vez que la misma migración se olvidó de un lugar: la
          # pantalla de guías, y acá. La lección quedó en el traspaso: al cambiar
          # un secreto hay que buscar TODOS los lugares que lo mandan, no solo
          # los que lo validan.
          #
          # ⚠️ HAY QUE CREAR EL SECRETO `BOT_PANEL_TOKEN` en el repo con el mismo
          #    valor que PANEL_TOKEN tiene en Render:
          #    GitHub → Settings → Secrets and variables → Actions → New secret
          #    Y cada vez que se rote PANEL_TOKEN, hay que actualizarlo ACÁ TAMBIÉN.
          BOT_TOKEN: ${{ secrets.BOT_PANEL_TOKEN }}
          DIA: ${{ github.event.inputs.dia }}
        run: |
          if [ -z "$BOT_URL" ] || [ -z "$BOT_TOKEN" ]; then
            echo "::error::Faltan los secretos BOT_URL y/o BOT_PANEL_TOKEN del repositorio."
            echo "::error::BOT_PANEL_TOKEN tiene que tener el MISMO valor que PANEL_TOKEN en Render."
            exit 1
          fi

          URL="$BOT_URL/cierre?token=$BOT_TOKEN&enviar=1"
          [ -n "$DIA" ] && URL="$URL&dia=$DIA"

          echo "Pidiendo el cierre..."
          # --max-time alto: Render puede tardar en despertar si estuvo inactivo
          CODE=$(curl -s -o respuesta.json -w "%{http_code}" --max-time 90 "$URL" || echo "000")
          echo "HTTP $CODE"

          if [ "$CODE" != "200" ]; then
            echo "::error::El bot respondió HTTP $CODE"
            # Un 403 tiene una sola causa y conviene decirla, no dejar que se
            # busque en cualquier otra parte: es exactamente lo que pasó el
            # 22-sep y costó un día de cierre.
            if [ "$CODE" = "403" ]; then
              echo "::error::403 = la clave no coincide. El secreto BOT_PANEL_TOKEN del repositorio tiene que ser IGUAL a PANEL_TOKEN en Render. Si rotaste PANEL_TOKEN, actualizá el secreto acá."
            fi
            cat respuesta.json || true
            exit 1
          fi

          echo "───────────── CIERRE DEL DÍA ─────────────"
          python3 -c "
          import json
          d = json.load(open('respuesta.json'))
          print(d.get('texto', '(sin texto)'))
          print()
          e = d.get('envio')
          if e:
              print('Envío a WhatsApp:', 'OK' if e.get('ok') else 'FALLÓ')
              print(' ', e.get('detalle', ''))
              print(' ', e.get('nota', ''))
          else:
              print('No se intentó enviar.')
          "
          echo "──────────────────────────────────────────"

          # El Action no falla si el WhatsApp no se entregó: el resumen ya quedó
          # arriba en el log, que es el objetivo mínimo.
          python3 -c "
          import json, sys
          d = json.load(open('respuesta.json'))
          e = d.get('envio') or {}
          if not e.get('ok'):
              print('::warning::El cierre no se pudo entregar por WhatsApp. Está en el log de arriba.')
          "
