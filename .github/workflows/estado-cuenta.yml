name: Estado de la cuenta

# Lee Meta Ads (SOLO LECTURA) y actualiza ESTADO-CUENTA.md en la raiz del repo,
# para poder ver los numeros desde el celular sin entrar a Kiro ni a Ads Manager.
#
# El token vive en Settings > Secrets and variables > Actions > META_ADS_TOKEN.
# NUNCA en un archivo del repo.

on:
  schedule:
    # CADA HORA, al minuto 23.
    #
    # 🔑 POR QUE EL MINUTO 23 Y NO EL 0: el minuto en punto es el mas congestionado
    # de GitHub — millones de workflows programados a "0 * * * *" compiten a la vez,
    # y GitHub retrasa o SALTA corridas cuando hay cola. Paso real: con "0 * * * *"
    # las corridas de las 19:00 y 20:00 del 17-sep nunca dispararon. Un minuto
    # impar y poco usado mejora bastante la probabilidad de que corra.
    #
    # Bogota = UTC-5 (offset entero), asi que el minuto 23 de UTC es tambien el
    # minuto 23 de Bogota.
    - cron: "23 * * * *"

  # Si se cambia el script o el workflow, regenerar el archivo de una en vez de
  # esperar la hora: si no, el ESTADO-CUENTA.md queda con el texto viejo.
  push:
    branches: [main]
    paths:
      - "analisis/estado-cuenta.py"
      - "analisis/meta-api-lectura.py"
      - ".github/workflows/estado-cuenta.yml"

  workflow_dispatch:        # boton manual, sirve desde la app de GitHub en el celular

permissions:
  contents: write

concurrency:
  group: estado-cuenta
  cancel-in-progress: false

jobs:
  leer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Leer Meta y escribir ESTADO-CUENTA.md
        env:
          META_ADS_TOKEN: ${{ secrets.META_ADS_TOKEN }}
        run: python3 analisis/estado-cuenta.py

      - name: Commitear (el historial de commits queda como bitacora horaria)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ESTADO-CUENTA.md
          if git diff --staged --quiet; then
            echo "sin cambios"
          else
            # El resumen de una linea lo escribe estado-cuenta.py. Asi la lista de
            # commits del repo se puede leer como un log horario sin abrir el archivo.
            MSG="$(cat /tmp/estado-resumen.txt 2>/dev/null || echo "Estado de la cuenta")"
            git commit -m "$MSG"
            # varias corridas pueden pisarse: reintentar con rebase
            for i in 1 2 3; do
              git push && break || { git pull --rebase --autostash -q origin main; sleep 3; }
            done
          fi
